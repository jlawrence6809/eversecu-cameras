[project]
name = "eversecu-canine-detector"
version = "0.1.0"
description = "Local canine candidate detector for EVERSECU/O-KAM RTSP cameras"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.11,<5",
  "python-dotenv>=1.1,<2",
  "torch>=2.8,<3",
  "torchvision>=0.23,<1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
